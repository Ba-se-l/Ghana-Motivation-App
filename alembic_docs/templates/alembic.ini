# A generic, single database configuration for Ghana Motivation Backend.

[alembic]
# Path to migration scripts folder
script_location = alembic

# Template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions in the versions/ folder
# sourceless = false

# Version location specification; This defaults to alembic/versions.
version_locations = alembic/versions

# Version path separator; This defaults to os.pathsep.
version_path_separator = os

# Set to 'true' to search source files recursively in each version directory
# recursive_version_locations = false

# The output encoding used when revisions are generated from script.py.mako
output_encoding = utf-8

# SQLAlchemy database connection URL.
# NOTE: In our project, this value is dynamically overridden inside alembic/env.py
# using GhanaMotivationApp.settings.settings.DATABASE_URL.
# This placeholder prevents Alembic from complaining if inspected directly.
sqlalchemy.url = postgresql+asyncpg://ghana_admin:ghana_secure_password_2026!@localhost:5432/ghana_motivation_db


[post_write_hooks]
# Post write hooks are used to post-process files written by Alembic.
# For example, to format with black or ruff:
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/Scripts/ruff.exe
# ruff.options = format REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
